[project]
name = "arctic-route-display"
version = "0.1.0"
description = "北极航线工作包 D：只读消费 v3/v2 路线制品并提供展示状态"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.scripts]
arctic-route-display = "arctic_route_display.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctic_route_display"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
